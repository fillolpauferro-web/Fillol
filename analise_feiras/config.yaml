# =============================================================================
# Configuração da análise recorrente de matrizes (Feira, Campanha, etc.)
#
# Este arquivo é o único lugar que você precisa editar toda vez que for rodar
# a análise: ligue/desligue matrizes em "ativo", aponte os caminhos dos
# arquivos e ajuste os nomes de coluna se a planilha de origem mudar.
# Não é preciso mexer no pipeline.py para isso.
# =============================================================================

# Todos os caminhos abaixo apontam para a pasta:
#   C:\Users\I0507867.FARMA\OneDrive - Sanofi\Desktop\Analise Painel
# Use barra normal "/" mesmo no Windows (funciona igual à contrabarra e evita
# problemas de escape no YAML). Se a pasta mudar de lugar, substitua o trecho
# "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel" em todos
# os caminhos deste arquivo (find & replace no editor).

base:
  # Arquivo(s) com a base grande de pedidos (exportação do ERP), com colunas
  # Tipo de cliente, CNPJ, Id pedido, EAN, Tabela de negociação...
  # Use * para juntar automaticamente vários arquivos que começam com o
  # mesmo prefixo (ex.: planilha_base_vendas_jan.csv, _fev.csv, ...).
  # Todos são lidos e empilhados num único DataFrame antes da análise.
  # Separador (';' ou ',') e encoding são detectados automaticamente.
  arquivo: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/planilha_base_vendas_*.csv"
  aba: null # null = primeira aba da planilha; ou informe o nome exato da aba
  colunas:
    tabela_negociacao: "Tabela de negociação"
    cnpj: "CNPJ"
    ean: "EAN"
    id_pedido: "Id pedido"
    tipo_cliente: "Tipo de cliente"
    data_pedido: "Data do pedido (original)"
    faturado_liquido: "Faturado líquido (R$)"
    desconto_aplicado_pct: "Desconto comercial faturado (%)"

# Arquivo usado no passo 4 (achar o desconto que deveria ter sido aplicado
# quando um pedido é identificado como erro operacional). O desconto correto
# é por produto (EAN); se a planilha também tiver a coluna "Tabela" (config
# chave_tabela abaixo), o desconto correto passa a variar por Tabela de
# negociação também — cada matriz busca a condição da SUA tabela (usando a
# própria palavra_chave da matriz) antes de casar por EAN.
# IMPORTANTE: chave_tabela abaixo só funciona depois que a coluna "Tabela"
# existir de fato na aba "Dados" do condicao_comercial.xlsx — sem ela,
# TODAS as matrizes (Feira incluída) vão dar erro de coluna ausente.
condicao_comercial:
  arquivo: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/condicao_comercial.xlsx"
  aba: "Dados"
  colunas:
    chave_ean: "EAN FORMATADO"
    desconto_correto_pct: "Desconto Atual"
    chave_tabela: "Tabela"
  # true porque a célula guarda 0.2398 (fração) e o Excel só EXIBE como
  # "23,98%" — confirmado lendo o valor cru da planilha do usuário
  desconto_em_fracao: true

# Cada item da lista abaixo é uma "matriz" de análise. Adicione quantas
# quiser; marque ativo: false para pular sem apagar a configuração. O campo
# "tipo" muda a lógica usada:
#
# tipo: "tabela" (padrão, ex.: Feira, Campanha) — filtra a base pela
#   palavra_chave na coluna "Tabela de negociação". Check = OK só quando as
#   DUAS condições são verdadeiras:
#     1. o CNPJ do pedido existe na coluna "chave_controle" do arquivo de
#        controle;
#     2. a data do pedido está dentro do período real (comparando só a
#        data, sem horário) — exige colunas_trazidas com as chaves
#        "inicio_real" e "termino_real" (como no exemplo da Feira). Se a
#        matriz não tiver essas duas chaves, só a condição 1 vale.
#   Fora disso, Check = "Erro Operacional".
#
# tipo: "cnpj" (ex.: Canal Autorizador) — não filtra pela Tabela de
#   negociação; filtra a base pelos CNPJs presentes no arquivo de controle
#   (ex.: Painel_NV). Check = OK só quando a "Tabela de negociação" do
#   pedido contém a palavra_chave configurada; qualquer pedido desses CNPJs
#   feito em condição diferente (ex.: Feira, Associativismo, etc. em vez de
#   Canal Autorizador) vira "Erro Operacional".
#   coluna_rotulo_controle/rotulo_valido_controle são opcionais: use quando
#   o arquivo de controle traz vários rótulos/canais misturados no mesmo
#   arquivo (caso do Painel_NV) e você precisa filtrar só as linhas do
#   rótulo desta matriz antes de montar a lista de CNPJs.
#
# tipo: "consolidacao" (ex.: Bandeira) — sem Check e sem cruzamento com
#   Condicao_comercial. Filtra a base pelos CNPJs do arquivo de controle
#   (ex.: Painel_Bandeira) e só consolida essas vendas num arquivo único,
#   trazendo as colunas de colunas_trazidas (ex.: Bandeira) pra dar pra
#   agrupar/analisar depois. Se tiver "regra" configurado (ver exemplo da
#   Bandeira abaixo), roda uma segunda camada em cima desse mesmo histórico:
#   Check = OK/Erro Operacional comparando a Tabela de negociação com o
#   Rotulo esperado por Raiz CNPJ, com o mesmo cálculo de desconto/preço
#   dos outros tipos — sai num segundo arquivo (regra.nome_arquivo_saida).
#
# Em todos os tipos, "colunas_trazidas" são copiadas pra saída sempre que o
# CNPJ é encontrado no controle (mesmo se o Check der erro, quando aplicável).
# "nome_arquivo_saida" (opcional) troca o nome padrão "{nome}_analise.xlsx"
# do arquivo de resultado.
matrizes:
  - nome: "Feira"
    tipo: "tabela"
    ativo: true
    palavra_chave: "FEIRA" # texto buscado em Tabela de negociação (sem acento/maiúsculas)
    arquivo_controle: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/Controle_Feiras.xlsx"
    aba_controle: "dados"
    # coluna do arquivo de controle com o CNPJ ajustado (lista de quem
    # realmente participou/está autorizado na feira)
    chave_controle: "CNPJ AJUSTADO"
    colunas_trazidas:
      evento: "EVENTO"
      inicio_real: "INÍCIO REAL"
      termino_real: "TÉRMINO REAL"
    # colunas de colunas_trazidas (nome lógico, à esquerda) que devem ser
    # convertidas para data
    colunas_data: ["inicio_real", "termino_real"]

  - nome: "Campanha"
    tipo: "tabela"
    ativo: false
    palavra_chave: "CAMPANHA"
    arquivo_controle: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/Controle_Campanhas.xlsx"
    aba_controle: "dados"
    chave_controle: "CNPJ Ajustado"
    colunas_trazidas:
      inicio_real: "Início Real"
      termino_real: "Término Real"
    colunas_data: ["inicio_real", "termino_real"]

  - nome: "CanalAutorizador"
    tipo: "cnpj"
    ativo: true
    # texto buscado (contém) na Tabela de negociação da base pra validar o
    # Check, e também no config.yaml -> condicao_comercial pra achar o
    # desconto certo desse canal na coluna "Tabela"
    palavra_chave: "CANAL AUTORIZADOR"
    # nome do arquivo muda a cada exportação (Painel_NV_XXXX) — usa * pra
    # sempre pegar o mais recente
    arquivo_controle: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/Painel_NV_*.xlsx"
    aba_controle: null
    chave_controle: "CNPJ ajustado"
    # o Painel_NV pode ter vários rótulos/canais no mesmo arquivo; filtra só
    # as linhas de Canal Autorizador antes de montar a lista de CNPJs.
    # ATENÇÃO: o rótulo no Painel_NV vem como "Canal_Aut", só que a Tabela de
    # negociação real na base é "Canal Autorizador" — por isso são dois
    # campos separados (rotulo_valido_controle vs. palavra_chave acima) em
    # vez de comparar o texto direto.
    coluna_rotulo_controle: "Rotulo"
    rotulo_valido_controle: "CANAL_AUT"
    colunas_trazidas: {}
    colunas_data: []

  - nome: "Bandeira"
    tipo: "consolidacao"
    ativo: true
    # nome do arquivo pode mudar a cada exportação, igual ao Painel_NV — usa
    # * pra sempre pegar o mais recente. AJUSTAR se o nome real for diferente.
    arquivo_controle: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/Painel_Bandeira*.xlsx"
    aba_controle: null
    chave_controle: "CNPJ Ajustado"
    # colunas do Painel_Bandeira trazidas pra saída — desc_bandeira é o nome
    # da bandeira (ex.: CARREFOUR), usado pra agrupar as vendas depois.
    colunas_trazidas:
      id_bandeira: "id_bandeira"
      bandeira: "desc_bandeira"
      perfil_bandeira: "perfil_bandeira"
      razao_social: "razao_social"
      cidade: "cidade"
      estado: "estado"
    colunas_data: []
    # nome do arquivo de resultado consolidado (em vez de "Bandeira_analise.xlsx")
    nome_arquivo_saida: "historico_bandeiras.xlsx"
    # Segunda camada: reaproveita o histórico consolidado acima (em memória,
    # sem reler nada) e cruza com o arquivo de regra pra gerar Check +
    # cálculo de desconto/preço, igual Feira/CanalAutorizador.
    # O cruzamento é por Raiz CNPJ (8 primeiros dígitos do CNPJ) — mais
    # confiável que casar pelo nome da bandeira, que pode ter grafias
    # diferentes pro mesmo grupo (ex.: "DROGARIA TAMOIO" vs "DROGARIATAMOIO").
    # O Rotulo do arquivo de regra (ex.: "GENERICO_D1000") é comparado com a
    # Tabela de negociação por palavra, não por texto exato: cada palavra do
    # Rotulo precisa aparecer (como prefixo) em alguma palavra da Tabela,
    # em qualquer ordem — cobre tanto abreviação ("CANAL_AUT" -> "Canal
    # Autorizador") quanto reordenação ("GENERICO_D1000" -> "Tabela
    # Agregadora - D1000_GENERICO", caso real confirmado na base do usuário).
    regra:
      arquivo: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/dados/regra.xlsx"
      aba: null
      colunas:
        chave_raiz_cnpj: "Raiz CNPJ"
        rotulo: "Rotulo"
      nome_arquivo_saida: "Bandeiras_Analise.xlsx"

saida:
  pasta: "C:/Users/I0507867.FARMA/OneDrive - Sanofi/Desktop/Analise Painel/saida"
